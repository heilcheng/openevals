# openevals model registry
#
# Snapshot date: 2026-11-24. See docs/MODELS.md for sources, method and open questions.
#
# Conventions
# - hf_repo: every repo ID was checked against https://huggingface.co/api/models/<id> (HTTP 200).
# - params_b / active_params_b: billions, as stated on the model card when available,
#   otherwise the safetensors total reported by the Hugging Face API (may include
#   vision encoders, MTP heads or drafter weights; noted where relevant).
# - context_length: tokens, as stated on the model card (native window, not YaRN-extended)
#   or config.json max_position_embeddings when the card is silent.
# - reasoning: "none" (no thinking mode), "hybrid" (thinking can be switched on and off),
#   "always" (always reasons; effort may be adjustable but cannot be disabled).
# - [model.sampling]: vendor-recommended settings for the default / non-thinking mode.
#   For reasoning = "always" models it is the only sampling table.
# - [model.sampling_thinking]: present only when the vendor gives separate thinking-mode settings.
#   For hybrid models whose card gives one setting for both modes, only [model.sampling] is used.
# - Keys the vendor does not state are omitted. max_tokens is a recommended generation budget.

